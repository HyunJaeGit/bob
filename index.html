<!doctype html>
<!-- BOB 게임 화면과 리소스 연결 -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141824" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>BOB | 공 피하기</title>
    <link rel="stylesheet" href="./style.css?v=3" />
    <script src="./game.js?v=3" defer></script>
  </head>
  <body>
    <main class="game">
      <header class="game__header">
        <div>
          <h1>BOB</h1>
          <p>날아오는 공을 피해 오래 살아남으세요.</p>
        </div>

        <div class="game__info">
          <p class="score">
            <span>생존 시간</span>
            <strong><span id="score">0.0</span><small>초</small></strong>
          </p>
        </div>
      </header>

      <div id="gameArea" class="game-area" aria-label="BOB 게임 화면">
        <div id="player" class="player" aria-hidden="true"></div>

        <div id="gameOverlay" class="game-overlay">
          <div class="game-overlay__content">
            <p id="status" role="status">준비됐나요?</p>
            <p id="finalScore" class="final-score" hidden></p>
            <button id="startButton" type="button">게임 시작</button>
          </div>
        </div>
      </div>

      <footer class="game__footer">
        <p>키보드: 방향키 또는 WASD · 태블릿: 게임 화면 드래그</p>
        <button id="installButton" type="button" hidden>BOB 앱 설치</button>
        <p>made by KwonHJ</p>
      </footer>
    </main>

  <script>
    // 오프라인 실행을 위한 서비스 워커를 등록합니다.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  
    // 설치할 수 있는 브라우저에서만 앱 설치 버튼을 표시합니다.
    const installButton = document.querySelector("#installButton");
    let installPrompt = null;
  
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPrompt = event;
      installButton.hidden = false;
    });
  
    installButton.addEventListener("click", async () => {
      if (!installPrompt) return;
  
      await installPrompt.prompt();
      installPrompt = null;
      installButton.hidden = true;
    });
  
    window.addEventListener("appinstalled", () => {
      installPrompt = null;
      installButton.hidden = true;
    });
  </script>
  </body>
</html>
