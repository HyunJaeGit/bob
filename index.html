<!doctype html>
<!-- BOB 게임의 화면 구조와 리소스 연결 -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOB | 공 피하기</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./game.js" defer></script>
  </head>
  <body>
    <main class="game">
      <header class="game__header">
        <div>
          <h1>BOB</h1>
          <p>위와 양옆에서 날아오는 공을 피하세요.</p>
        </div>
        <div class="game__info">
          <p class="score">생존 시간 <strong id="score">0</strong>초</p>
          <p id="phase" class="phase">흰 공 단계</p>
        </div>
      </header>

      <div id="gameArea" class="game-area" aria-label="BOB 게임 화면">
        <div id="player" class="player" aria-hidden="true"></div>
      </div>

      <footer class="game__footer">
        <p id="status" role="status">시작 버튼을 눌러주세요.</p>
        <p class="guide">키보드: 방향키 또는 WASD · 태블릿: 게임 화면 드래그</p>
        <button id="startButton" type="button">게임 시작</button>
      </footer>
    </main>
  </body>
</html>
