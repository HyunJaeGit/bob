<!doctype html>
<!-- BOB 게임 화면과 PWA 설치 기능 연결 -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141824" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>BOB | 공 피하기</title>
    <link rel="stylesheet" href="./style.css?v=5" />
    <script src="./game.js?v=3" defer></script>
  </head>
  <body>
    <main class="game">
      <header class="game__header">
        <div>
          <h1>BOB</h1>
          <p>날아오는 공을 피해 오래 살아남으세요.</p>
        </div>

        <div class="game__info">
          <p class="score">
            <span>생존 시간</span>
            <strong><span id="score">0.0</span><small>초</small></strong>
          </p>
        </div>
      </header>

      <div id="gameArea" class="game-area" aria-label="BOB 게임 화면">
        <div id="player" class="player" aria-hidden="true"></div>

        <div id="gameOverlay" class="game-overlay">
          <div class="game-overlay__content">
            <p id="status" role="status">준비됐나요?</p>
            <p id="finalScore" class="final-score" hidden></p>

            <div class="game-overlay__actions">
              <button id="startButton" type="button">웹으로 플레이</button>
              <button id="installButton" type="button" hidden>
                앱 설치하기
              </button>
            </div>
          </div>
        </div>
      </div>

      <footer class="game__footer">
        <p>키보드: 방향키 또는 WASD · 태블릿: 게임 화면 드래그</p>
        <p>made by KwonHJ</p>
      </footer>
    </main>

    <script>
      // 오프라인 실행을 위한 서비스 워커를 등록합니다.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js");
        });
      }

      const installButton = document.querySelector("#installButton");
      const startButtonElement = document.querySelector("#startButton");

      let installPrompt = null;
      let hasStartedGame = false;

      // 설치 가능한 브라우저에서만 설치 선택지를 표시합니다.
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        installPrompt = event;

        if (!hasStartedGame) {
          installButton.hidden = false;
        }
      });

      // 게임을 시작한 뒤에는 종료 화면에도 설치 버튼을 표시하지 않습니다.
      startButtonElement.addEventListener("click", () => {
        hasStartedGame = true;
        installButton.hidden = true;
      });

      installButton.addEventListener("click", async () => {
        if (!installPrompt) return;

        await installPrompt.prompt();
        installPrompt = null;
        installButton.hidden = true;
      });

      window.addEventListener("appinstalled", () => {
        installPrompt = null;
        installButton.hidden = true;
      });
    </script>
  </body>
</html>
